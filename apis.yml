aid: icontrol
name: iControl
description: iControl is a Swedish construction-technology company whose mobile application
  digitalizes documentation on construction sites, replacing paper-based protocols and
  inspection records with real-time digital capture. Field personnel create, share, and
  manage project documentation from the job site, with offline capture that syncs when
  connectivity returns, drawing and blueprint uploads, and team collaboration. Marketed
  under the promise "Skriv aldrig ett protokoll igen" (never write a protocol again),
  iControl is used by leading Nordic contractors including NCC, JM, Veidekke, ARCONA, and
  In3prenor across infrastructure, residential, commercial, and public-facility projects.
  The company is headquartered in Stockholm and is a portfolio company of 500 Global.
  iControl exposes a consumer-facing web and mobile application; no public developer API,
  OpenAPI specification, or SDK was found during enrichment.
